name: Next.js CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-build-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16
          cache: "yarn"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: yarn install
        if: success()

      # Step 4: Lint the code
      - name: Run ESLint
        run: yarn lint
        if: success()

      # Step 5: Build the Next.js application
      - name: Build Next.js app
        run: yarn build
        if: success()

      # Step 6: Test the production build
      - name: Start production server for testing
        run: |
          yarn start &
          sleep 10
          curl -Is http://localhost:3000 | head -n 1
        if: success()

      # Step 7: Deploy to Vercel
      - name: Deploy to Vercel
        run: npx vercel deploy --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        if: success()

      # Step 8: Notify failure (optional step)
      - name: Notify Failure
        if: failure()
        run: echo "Workflow failed. Please check the logs and fix errors."
